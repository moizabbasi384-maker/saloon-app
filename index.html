<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Noir & Co. — Luxury Salon</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#C9A96E;--gold-light:#E8D5B0;--gold-dark:#8B6B3D;
  --ink:#0A0908;--ink2:#141210;--ink3:#1E1C1A;--ink4:#2A2825;
  --paper:#F7F3ED;--paper2:#EDE8DF;--muted:#8A8480;
}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',sans-serif;background:var(--ink);color:var(--paper);min-height:100vh;overflow-x:hidden}

/* ── NOISE TEXTURE ── */
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");opacity:.035;pointer-events:none;z-index:0}

/* ── SHELL ── */
.shell{position:relative;z-index:1;max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}

/* ── HEADER ── */
.header{display:flex;align-items:center;justify-content:space-between;padding:32px 24px 0}
.logo-eyebrow{font-size:9px;letter-spacing:.22em;color:var(--gold);text-transform:uppercase;margin-bottom:3px}
.logo-name{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:300;letter-spacing:.06em}
.manage-btn{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);background:transparent;border:.5px solid var(--gold-dark);padding:9px 18px;cursor:pointer;transition:all .2s;font-family:'DM Sans',sans-serif}
.manage-btn:hover{background:rgba(201,169,110,.1);border-color:var(--gold)}

/* ── PROGRESS ── */
.progress-wrap{padding:28px 24px 0;display:flex;gap:5px}
.seg{flex:1;height:1px;background:var(--ink4);transition:background .4s}
.seg.done{background:var(--gold)}
.seg.active{background:var(--gold-light)}
.step-label{padding:10px 24px 0;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}

/* ── STEP HEADING ── */
.step-heading{padding:20px 24px 4px}
.step-heading h2{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:300;line-height:1.15;color:var(--paper)}
.step-heading p{font-size:12px;color:var(--muted);margin-top:5px;font-weight:300}

/* ── DIVIDER ── */
.divider{display:flex;align-items:center;gap:10px;padding:0 24px;margin:6px 0 18px}
.div-line{flex:1;height:.5px;background:var(--ink4)}
.div-diamond{width:5px;height:5px;background:var(--gold-dark);transform:rotate(45deg);flex-shrink:0}

/* ── CONTENT ── */
.content{padding:0 24px;flex:1}

/* ── SERVICE CARDS ── */
.services-grid{display:flex;flex-direction:column;gap:10px}
.service-card{display:flex;align-items:center;gap:0;background:var(--ink2);border:.5px solid var(--ink4);cursor:pointer;transition:all .25s;position:relative;overflow:hidden}
.service-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--gold);transform:scaleY(0);transform-origin:bottom;transition:transform .25s}
.service-card:hover{background:var(--ink3)}
.service-card:hover::before{transform:scaleY(.4)}
.service-card.selected{border-color:var(--gold-dark);background:#1A1710}
.service-card.selected::before{transform:scaleY(1)}

.svc-img{width:90px;height:90px;object-fit:cover;flex-shrink:0;filter:brightness(.85) sepia(.15)}
.svc-body{padding:14px 16px;flex:1}
.svc-num{font-size:8px;letter-spacing:.22em;color:var(--gold-dark);text-transform:uppercase;margin-bottom:3px}
.svc-name{font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:400}
.svc-desc{font-size:11px;color:var(--muted);margin-top:2px;font-weight:300}
.svc-right{padding:14px 16px;display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;gap:8px}
.svc-price{font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--gold);font-weight:300}
.svc-price sup{font-size:11px;color:var(--gold-dark);vertical-align:super}
.svc-check{width:18px;height:18px;border:.5px solid var(--gold-dark);border-radius:50%;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
.service-card.selected .svc-check{background:var(--gold);border-color:var(--gold)}
.check-svg{opacity:0;transition:opacity .2s}
.service-card.selected .check-svg{opacity:1}

/* ── STYLIST CARDS ── */
.stylists-grid{display:flex;flex-direction:column;gap:10px}
.stylist-card{display:flex;align-items:center;gap:0;background:var(--ink2);border:.5px solid var(--ink4);cursor:pointer;transition:all .25s;overflow:hidden;position:relative}
.stylist-card:hover{background:var(--ink3)}
.stylist-card.selected{border-color:var(--gold-dark);background:#1A1710}
.stylist-img{width:80px;height:80px;object-fit:cover;flex-shrink:0;object-position:top;filter:brightness(.85) sepia(.1)}
.stylist-body{padding:14px 16px;flex:1}
.stylist-name{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:400}
.stylist-role{font-size:11px;color:var(--muted);margin-top:2px;font-weight:300}
.stylist-stars{color:var(--gold);font-size:10px;margin-top:4px;letter-spacing:2px}
.stylist-badge{margin-right:16px;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);border:.5px solid var(--gold-dark);padding:4px 10px;white-space:nowrap}

/* ── CALENDAR ── */
.calendar{background:var(--ink2);border:.5px solid var(--ink4);padding:20px}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.cal-month{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:400}
.cal-nav{background:transparent;border:.5px solid var(--ink4);color:var(--muted);width:30px;height:30px;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;transition:all .2s}
.cal-nav:hover{border-color:var(--gold-dark);color:var(--gold)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-day-name{text-align:center;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:6px 0}
.cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:300;cursor:pointer;color:var(--paper);transition:all .15s;position:relative;border-radius:0}
.cal-day.empty{pointer-events:none}
.cal-day.past{color:var(--ink4);cursor:default;pointer-events:none}
.cal-day.today::after{content:'';position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:3px;height:3px;background:var(--gold);border-radius:50%}
.cal-day:not(.past):not(.empty):hover{color:var(--gold)}
.cal-day.selected{background:var(--gold);color:var(--ink)!important;font-weight:500}

/* ── TIME SLOTS ── */
.times-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.time-slot{padding:14px 8px;background:var(--ink2);border:.5px solid var(--ink4);text-align:center;cursor:pointer;transition:all .2s;font-family:'Cormorant Garamond',serif;font-size:17px;color:var(--paper)}
.time-slot:hover{border-color:var(--gold-dark);color:var(--gold)}
.time-slot.selected{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.time-period{font-family:'DM Sans',sans-serif;font-size:9px;letter-spacing:.08em;text-transform:uppercase;display:block;margin-top:1px;opacity:.7}

/* ── FORM ── */
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-dark);margin-bottom:7px}
.form-input{width:100%;background:var(--ink2);border:.5px solid var(--ink4);color:var(--paper);font-family:'DM Sans',sans-serif;font-size:14px;font-weight:300;padding:13px 15px;outline:none;transition:border-color .2s}
.form-input:focus{border-color:var(--gold-dark)}
.form-input::placeholder{color:var(--muted);font-size:13px}

/* ── SUMMARY BOX ── */
.summary-box{background:var(--ink2);border:.5px solid var(--ink4);border-left:2px solid var(--gold-dark);padding:14px 16px;margin-bottom:16px}
.sum-row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:300}
.sum-row.total{color:var(--paper);border-top:.5px solid var(--ink4);padding-top:8px;margin-top:6px;margin-bottom:0}
.sum-total{font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--gold)}

/* ── NAV BUTTONS ── */
.nav{padding:24px 24px 36px;display:flex;gap:10px}
.btn{flex:1;padding:15px;font-family:'DM Sans',sans-serif;font-size:10px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;transition:all .2s;border:none;outline:none}
.btn-back{background:transparent;color:var(--muted);border:.5px solid var(--ink4)}
.btn-back:hover{border-color:var(--muted);color:var(--paper)}
.btn-next{background:var(--gold);color:var(--ink);font-weight:500}
.btn-next:hover{background:var(--gold-light)}
.btn-next:disabled{background:var(--ink4);color:var(--muted);cursor:default}
.btn-confirm{background:transparent;border:.5px solid var(--gold-dark);color:var(--gold);font-weight:500}
.btn-confirm:hover{background:rgba(201,169,110,.1)}
.btn-confirm:disabled{opacity:.4;cursor:default}

/* ── OVERLAY ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;z-index:999;opacity:0;pointer-events:none;transition:opacity .3s;padding:20px}
.overlay.open{opacity:1;pointer-events:all}

/* ── SUCCESS MODAL ── */
.success-modal{background:var(--ink2);border:.5px solid var(--gold-dark);padding:44px 38px;max-width:340px;width:100%;text-align:center;transform:translateY(20px);transition:transform .35s ease}
.overlay.open .success-modal{transform:translateY(0)}
.success-ring{width:60px;height:60px;border:.5px solid var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 22px}
.success-title{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:300;margin-bottom:8px}
.success-sub{font-size:12px;color:var(--muted);font-weight:300;line-height:1.7;margin-bottom:8px}
.success-id{font-size:10px;letter-spacing:.12em;color:var(--gold-dark);margin-bottom:24px}
.ornament{color:var(--gold-dark);font-size:16px;letter-spacing:10px;margin:10px 0}
.success-close{width:100%;padding:14px;background:transparent;border:.5px solid var(--gold-dark);color:var(--gold);font-family:'DM Sans',sans-serif;font-size:10px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;transition:all .2s;margin-top:16px}
.success-close:hover{background:rgba(201,169,110,.1)}

/* ── MANAGE MODAL ── */
.manage-modal{background:var(--ink2);border:.5px solid var(--ink4);border-top:2px solid var(--gold-dark);padding:32px 28px;max-width:420px;width:100%;transform:translateY(20px);transition:transform .35s ease;max-height:90vh;overflow-y:auto}
.overlay.open .manage-modal{transform:translateY(0)}
.manage-title{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:300;margin-bottom:4px}
.manage-sub{font-size:12px;color:var(--muted);margin-bottom:20px;font-weight:300}
.booking-card{background:var(--ink);border:.5px solid var(--ink4);border-left:2px solid var(--gold-dark);padding:14px 16px;margin-bottom:8px}
.booking-svc{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:400}
.booking-meta{font-size:11px;color:var(--muted);margin-top:3px;font-weight:300;line-height:1.6}
.manage-actions{display:flex;gap:8px;margin-top:14px}
.ma-btn{flex:1;padding:11px;font-family:'DM Sans',sans-serif;font-size:9px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;transition:all .2s;background:transparent;border:.5px solid var(--ink4);color:var(--muted)}
.ma-btn:hover{color:var(--paper);border-color:var(--muted)}
.ma-btn.danger:hover{color:#E05252;border-color:#E05252}
.ma-close{width:100%;padding:11px;background:transparent;border:.5px solid var(--ink4);color:var(--muted);font-family:'DM Sans',sans-serif;font-size:9px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;margin-top:8px;transition:all .2s}
.ma-close:hover{color:var(--paper);border-color:var(--muted)}

/* Resched panel */
.resched-panel{margin-top:14px;background:var(--ink);border:.5px solid var(--ink4);padding:16px;display:none}
.resched-panel.open{display:block}
.resched-submit{width:100%;padding:12px;background:var(--gold);color:var(--ink);border:none;font-family:'DM Sans',sans-serif;font-size:9px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;font-weight:500;margin-top:8px;transition:background .2s}
.resched-submit:hover{background:var(--gold-light)}

/* ── TOAST ── */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(40px);background:var(--ink2);border:.5px solid var(--gold-dark);color:var(--paper);font-size:12px;font-weight:300;padding:12px 22px;letter-spacing:.04em;opacity:0;transition:all .35s;z-index:9999;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── LOADING SPINNER ── */
.spinner{display:inline-block;width:14px;height:14px;border:1.5px solid rgba(201,169,110,.3);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── STEP FADE ── */
.step-in{animation:fadeUp .3s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Scrollbar */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:var(--ink)}
::-webkit-scrollbar-thumb{background:var(--ink4)}
</style>
</head>
<body>

<div class="shell">

  <!-- HEADER -->
  <div class="header">
    <div>
      <div class="logo-eyebrow">Est. 2010 · Premium Grooming</div>
      <div class="logo-name">Noir <span style="color:var(--gold);">&</span> Co.</div>
    </div>
    <button class="manage-btn" onclick="openManage()">Manage Booking</button>
  </div>

  <!-- PROGRESS -->
  <div class="progress-wrap" id="progressWrap"></div>
  <div class="step-label" id="stepLabel"></div>

  <!-- HEADING -->
  <div class="step-heading">
    <h2 id="stepTitle"></h2>
    <p id="stepSub"></p>
  </div>

  <div class="divider"><div class="div-line"></div><div class="div-diamond"></div><div class="div-line"></div></div>

  <!-- STEP CONTENT -->
  <div class="content" id="stepContent"></div>

  <!-- NAV -->
  <div class="nav" id="navWrap"></div>

</div>

<!-- SUCCESS OVERLAY -->
<div class="overlay" id="successOverlay">
  <div class="success-modal">
    <div class="success-ring">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#C9A96E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <div class="success-title">Appointment Confirmed</div>
    <div class="success-sub">Your reservation has been secured.<br>We look forward to welcoming you.</div>
    <div class="success-id" id="bookingIdDisplay"></div>
    <div class="ornament">· · ✦ · ·</div>
    <button class="success-close" onclick="closeSuccess()">Close & Return</button>
  </div>
</div>

<!-- MANAGE OVERLAY -->
<div class="overlay" id="manageOverlay">
  <div class="manage-modal">
    <div class="manage-title">Manage Reservation</div>
    <div class="manage-sub">Enter your phone number to access your booking</div>

    <div class="form-group">
      <label class="form-label">Phone Number</label>
      <input class="form-input" id="mPhone" placeholder="+1 (000) 000-0000" />
    </div>
    <button class="btn btn-next" style="width:100%;margin-bottom:14px" onclick="searchBooking()">
      <span id="searchBtnText">Search Booking</span>
    </button>

    <div id="bookingResults"></div>

    <!-- Reschedule panel -->
    <div class="resched-panel" id="reschedPanel">
      <div class="form-group" style="margin-bottom:10px">
        <label class="form-label">New Date (e.g. May 20, 2025)</label>
        <input class="form-input" id="rNewDate" placeholder="May 20, 2025"/>
      </div>
      <div class="form-group" style="margin-bottom:10px">
        <label class="form-label">New Time (e.g. 3:00 PM)</label>
        <input class="form-input" id="rNewTime" placeholder="3:00 PM"/>
      </div>
      <button class="resched-submit" onclick="doReschedule()">Confirm Reschedule</button>
    </div>

    <div class="manage-actions" id="manageActions" style="display:none">
      <button class="ma-btn" onclick="toggleResched()">↺ Reschedule</button>
      <button class="ma-btn danger" onclick="doCancel()">✕ Cancel Booking</button>
    </div>
    <button class="ma-close" onclick="closeManage()">Close</button>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
const API = "https://script.google.com/macros/s/AKfycbwUFZ2WxADCLACfQouIX15gJxJggSVlef95YLcH-ciQcVre1u8AJmkixk2AJb5odSoyrQ/exec";

// ── DATA ─────────────────────────────────────────────────────────
const SERVICES = [
  {
    id:1, name:"Haircut", desc:"Precision cut & finish by a master barber", price:25,
    img:"https://images.unsplash.com/photo-1585747860715-2ba37e788b70?w=200&q=80&fit=crop"
  },
  {
    id:2, name:"Beard Trim", desc:"Expert sculpt, shape & hot-towel finish", price:15,
    img:"https://images.unsplash.com/photo-1621605815971-fbc98d665033?w=200&q=80&fit=crop"
  },
  {
    id:3, name:"Facial", desc:"Luxury deep-cleanse skin treatment", price:40,
    img:"https://images.unsplash.com/photo-1570172619644-dfd03ed5d881?w=200&q=80&fit=crop"
  }
];

const STYLISTS = [
  {
    id:1, name:"James Walker", role:"Master Stylist · 12 yrs", stars:"★★★★★", senior:true,
    img:"https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=200&q=80&fit=crop&face"
  },
  {
    id:2, name:"Michael Ross", role:"Senior Artisan · 8 yrs", stars:"★★★★☆", senior:false,
    img:"https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=200&q=80&fit=crop&face"
  }
];

const TIMES = ["10:00 AM","11:00 AM","1:00 PM","3:00 PM","5:00 PM"];
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const SHORT_M = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

// ── STATE ────────────────────────────────────────────────────────
let step = 1;
let selServices = [];
let selStylist  = null;
let selDate     = null;
let selTime     = "";
let userName    = "";
let userPhone   = "";
let calYear, calMonth;
const now = new Date();
calYear  = now.getFullYear();
calMonth = now.getMonth();

const STEP_LABELS = ["","Step 1 of 5 — Services","Step 2 of 5 — Stylist","Step 3 of 5 — Date","Step 4 of 5 — Time","Step 5 of 5 — Details"];
const STEP_TITLES = ["","Choose your services","Select your artisan","Pick a date","Choose a time","Your details"];
const STEP_SUBS   = ["","Select one or more treatments","Your experience, tailored by the best","Find your perfect moment","Secure your preferred time","Complete your reservation"];

// ── HELPERS ──────────────────────────────────────────────────────
const api = async body => {
  const r = await fetch(API, {method:"POST", body:JSON.stringify(body)});
  return r.json();
};

const toast = (msg, dur=3000) => {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), dur);
};

const total = () => selServices.reduce((a,b)=>a+b.price,0);

// ── RENDER ────────────────────────────────────────────────────────
function render(){
  updateProgress();
  const c = document.getElementById("stepContent");
  c.innerHTML=""; c.className="content step-in";

  if(step===1) renderServices(c);
  else if(step===2) renderStylists(c);
  else if(step===3) renderCalendar(c);
  else if(step===4) renderTimes(c);
  else if(step===5) renderInfo(c);

  renderNav();
}

function updateProgress(){
  const pw = document.getElementById("progressWrap");
  pw.innerHTML = [1,2,3,4,5].map(i=>`<div class="seg${i<step?" done":i===step?" active":""}"></div>`).join("");
  document.getElementById("stepLabel").textContent = STEP_LABELS[step];
  document.getElementById("stepTitle").textContent = STEP_TITLES[step];
  document.getElementById("stepSub").textContent   = STEP_SUBS[step];
}

// ── STEP 1: SERVICES ─────────────────────────────────────────────
function renderServices(c){
  const g = document.createElement("div"); g.className="services-grid";
  SERVICES.forEach((s,i)=>{
    const active = selServices.find(x=>x.id===s.id);
    const d = document.createElement("div");
    d.className = "service-card" + (active?" selected":"");
    d.innerHTML = `
      <img class="svc-img" src="${s.img}" alt="${s.name}" loading="lazy"/>
      <div class="svc-body">
        <div class="svc-num">0${i+1}</div>
        <div class="svc-name">${s.name}</div>
        <div class="svc-desc">${s.desc}</div>
      </div>
      <div class="svc-right">
        <div class="svc-price"><sup>$</sup>${s.price}</div>
        <div class="svc-check">
          <svg class="check-svg" width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="#0A0908" stroke-width="2" stroke-linecap="round"><polyline points="1.5 6 4.5 9 10.5 3"/></svg>
        </div>
      </div>`;
    d.onclick = ()=>{
      const idx = selServices.findIndex(x=>x.id===s.id);
      if(idx>=0) selServices.splice(idx,1); else selServices.push(s);
      render();
    };
    g.appendChild(d);
  });
  c.appendChild(g);
}

// ── STEP 2: STYLISTS ─────────────────────────────────────────────
function renderStylists(c){
  const g = document.createElement("div"); g.className="stylists-grid";
  STYLISTS.forEach(s=>{
    const d = document.createElement("div");
    d.className="stylist-card"+(selStylist?.id===s.id?" selected":"");
    d.innerHTML=`
      <img class="stylist-img" src="${s.img}" alt="${s.name}" loading="lazy"/>
      <div class="stylist-body">
        <div class="stylist-name">${s.name}</div>
        <div class="stylist-role">${s.role}</div>
        <div class="stylist-stars">${s.stars}</div>
      </div>
      ${s.senior?'<div class="stylist-badge">Preferred</div>':''}`;
    d.onclick=()=>{selStylist=s;render();};
    g.appendChild(d);
  });
  c.appendChild(g);
}

// ── STEP 3: CALENDAR ─────────────────────────────────────────────
function renderCalendar(c){
  const firstDay = new Date(calYear,calMonth,1).getDay();
  const daysInMonth = new Date(calYear,calMonth+1,0).getDate();
  const todD=now.getDate(), todM=now.getMonth(), todY=now.getFullYear();

  let rows = `<div class="cal-day-name">Su</div><div class="cal-day-name">Mo</div><div class="cal-day-name">Tu</div><div class="cal-day-name">We</div><div class="cal-day-name">Th</div><div class="cal-day-name">Fr</div><div class="cal-day-name">Sa</div>`;
  for(let i=0;i<firstDay;i++) rows+=`<div class="cal-day empty"></div>`;
  for(let d=1;d<=daysInMonth;d++){
    const past=(calYear<todY)||(calYear===todY&&calMonth<todM)||(calYear===todY&&calMonth===todM&&d<todD);
    const isToday=d===todD&&calMonth===todM&&calYear===todY;
    const isSel=selDate&&d===selDate.d&&calMonth===selDate.m&&calYear===selDate.y;
    let cls="cal-day";
    if(past)cls+=" past";
    if(isToday)cls+=" today";
    if(isSel)cls+=" selected";
    rows+=`<div class="${cls}" onclick="pickDay(${d})">${d}</div>`;
  }

  const wrap=document.createElement("div");
  wrap.className="calendar";
  wrap.innerHTML=`
    <div class="cal-header">
      <button class="cal-nav" onclick="prevMonth()">&#8592;</button>
      <span class="cal-month">${MONTHS[calMonth]} ${calYear}</span>
      <button class="cal-nav" onclick="nextMonth()">&#8594;</button>
    </div>
    <div class="cal-grid">${rows}</div>`;
  c.appendChild(wrap);
}

window.prevMonth=()=>{calMonth--;if(calMonth<0){calMonth=11;calYear--;}render();};
window.nextMonth=()=>{calMonth++;if(calMonth>11){calMonth=0;calYear++;}render();};
window.pickDay=(d)=>{
  const now2=new Date();
  const past=(calYear<now2.getFullYear())||(calYear===now2.getFullYear()&&calMonth<now2.getMonth())||(calYear===now2.getFullYear()&&calMonth===now2.getMonth()&&d<now2.getDate());
  if(past)return;
  selDate={d,m:calMonth,y:calYear};render();
};

// ── STEP 4: TIMES ────────────────────────────────────────────────
function renderTimes(c){
  const g=document.createElement("div"); g.className="times-grid";
  TIMES.forEach(t=>{
    const [hm,period]=t.split(" ");
    const slot=document.createElement("div");
    slot.className="time-slot"+(selTime===t?" selected":"");
    slot.innerHTML=`${hm}<span class="time-period">${period}</span>`;
    slot.onclick=()=>{selTime=t;render();};
    g.appendChild(slot);
  });
  c.appendChild(g);
}

// ── STEP 5: INFO ─────────────────────────────────────────────────
function renderInfo(c){
  const ds=selDate?`${SHORT_M[selDate.m]} ${selDate.d}, ${selDate.y}`:"—";
  c.innerHTML=`
    <div class="summary-box">
      <div class="sum-row"><span>Services</span><span>${selServices.map(s=>s.name).join(", ")||"—"}</span></div>
      <div class="sum-row"><span>Stylist</span><span>${selStylist?.name||"—"}</span></div>
      <div class="sum-row"><span>Date & Time</span><span>${ds} · ${selTime||"—"}</span></div>
      <div class="sum-row total"><span>Total</span><span class="sum-total">$${total()}</span></div>
    </div>
    <div class="form-group">
      <label class="form-label">Full Name</label>
      <input class="form-input" id="fName" placeholder="Your full name" value="${userName}" oninput="userName=this.value;updateConfirm()"/>
    </div>
    <div class="form-group">
      <label class="form-label">Phone Number</label>
      <input class="form-input" id="fPhone" placeholder="+1 (000) 000-0000" value="${userPhone}" oninput="userPhone=this.value;updateConfirm()"/>
    </div>`;
}

window.updateConfirm=()=>{
  const btn=document.getElementById("confirmBtn");
  if(btn) btn.disabled=!userName.trim()||!userPhone.trim();
};

// ── NAV ──────────────────────────────────────────────────────────
function renderNav(){
  const nav=document.getElementById("navWrap");
  nav.innerHTML="";
  if(step>1){
    const b=document.createElement("button");b.className="btn btn-back";b.textContent="← Back";
    b.onclick=()=>{step--;render();};nav.appendChild(b);
  }
  if(step<5){
    const n=document.createElement("button");n.className="btn btn-next";n.textContent="Continue →";
    if(step===1&&selServices.length===0)n.disabled=true;
    if(step===2&&!selStylist)n.disabled=true;
    if(step===3&&!selDate)n.disabled=true;
    if(step===4&&!selTime)n.disabled=true;
    n.onclick=()=>{step++;render();};nav.appendChild(n);
  }
  if(step===5){
    const cf=document.createElement("button");
    cf.className="btn btn-confirm";cf.id="confirmBtn";
    cf.textContent="Confirm Reservation";
    cf.disabled=!userName.trim()||!userPhone.trim();
    cf.onclick=bookAppointment;nav.appendChild(cf);
  }
}

// ── BOOK ─────────────────────────────────────────────────────────
async function bookAppointment(){
  const btn=document.getElementById("confirmBtn");
  if(!btn)return;
  btn.disabled=true;
  btn.innerHTML=`<span class="spinner"></span>Booking...`;

  const ds=`${SHORT_M[selDate.m]} ${selDate.d}, ${selDate.y}`;
  try{
    const res=await api({
      action:"book",
      name:userName.trim(),
      phone:userPhone.trim(),
      service:selServices.map(s=>s.name).join(", "),
      stylist:selStylist.name,
      date:ds,
      time:selTime,
      price:total()
    });
    if(res.success){
      document.getElementById("bookingIdDisplay").textContent = res.id ? `Booking ID: ${res.id}` : "";
      document.getElementById("successOverlay").classList.add("open");
    } else {
      toast("⚠ "+res.message);
      btn.disabled=false;btn.textContent="Confirm Reservation";
    }
  }catch(e){
    toast("Network error. Please try again.");
    btn.disabled=false;btn.textContent="Confirm Reservation";
  }
}

function closeSuccess(){
  document.getElementById("successOverlay").classList.remove("open");
  // Reset everything and refresh
  setTimeout(()=>location.reload(),300);
}

// ── MANAGE ───────────────────────────────────────────────────────
function openManage(){
  document.getElementById("manageOverlay").classList.add("open");
  document.getElementById("bookingResults").innerHTML="";
  document.getElementById("manageActions").style.display="none";
  document.getElementById("reschedPanel").classList.remove("open");
  document.getElementById("mPhone").value="";
}
function closeManage(){
  document.getElementById("manageOverlay").classList.remove("open");
}

async function searchBooking(){
  const phone=document.getElementById("mPhone").value.trim();
  if(!phone){toast("Please enter your phone number.");return;}
  const btn=document.getElementById("searchBtnText");
  btn.innerHTML=`<span class="spinner"></span>Searching...`;
  try{
    const res=await api({action:"getBooking",phone});
    btn.textContent="Search Booking";
    const results=document.getElementById("bookingResults");
    const actions=document.getElementById("manageActions");
    if(res.success&&res.bookings&&res.bookings.length>0){
      results.innerHTML=res.bookings.map(b=>`
        <div class="booking-card">
          <div class="booking-svc">${b.service}</div>
          <div class="booking-meta">
            👤 ${b.name}<br>
            ✂️ ${b.stylist}<br>
            📅 ${b.date} · ${b.time}<br>
            💰 $${b.price}
          </div>
        </div>`).join("");
      actions.style.display="flex";
    } else {
      results.innerHTML=`<div style="font-size:12px;color:var(--muted);padding:10px 0">No active booking found for this number.</div>`;
      actions.style.display="none";
    }
  }catch(e){
    btn.textContent="Search Booking";
    toast("Network error. Please try again.");
  }
}

function toggleResched(){
  const p=document.getElementById("reschedPanel");
  p.classList.toggle("open");
}

async function doReschedule(){
  const phone=document.getElementById("mPhone").value.trim();
  const date=document.getElementById("rNewDate").value.trim();
  const time=document.getElementById("rNewTime").value.trim();
  if(!phone||!date||!time){toast("Please fill in all fields.");return;}
  try{
    const res=await api({action:"reschedule",phone,date,time});
    if(res.success){
      toast("✓ "+res.message,4000);
      document.getElementById("reschedPanel").classList.remove("open");
      document.getElementById("rNewDate").value="";
      document.getElementById("rNewTime").value="";
      await searchBooking(); // refresh results
    } else {
      toast("⚠ "+res.message,4000);
    }
  }catch(e){
    toast("Network error. Please try again.");
  }
}

async function doCancel(){
  const phone=document.getElementById("mPhone").value.trim();
  if(!phone){toast("Please search your booking first.");return;}
  if(!confirm("Are you sure you want to cancel your appointment?"))return;
  try{
    const res=await api({action:"cancel",phone});
    if(res.success){
      toast("✓ "+res.message,4000);
      document.getElementById("bookingResults").innerHTML=`<div style="font-size:12px;color:var(--muted);padding:10px 0">Your booking has been cancelled.</div>`;
      document.getElementById("manageActions").style.display="none";
      document.getElementById("reschedPanel").classList.remove("open");
    } else {
      toast("⚠ "+res.message,4000);
    }
  }catch(e){
    toast("Network error. Please try again.");
  }
}

// ── INIT ─────────────────────────────────────────────────────────
render();
</script>
</body>
</html>
